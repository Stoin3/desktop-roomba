name: Windows

on:
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # nodig om een release aan te maken bij een v*-tag

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Afhankelijkheden
        run: python -m pip install -r requirements-windows.txt pytest pillow pyinstaller psutil
      - name: Tests
        run: python -m pytest -q tests
      - name: Diagnose (wat ziet de roomba?)
        run: python -m kde_roomba.windows_shell -v
        continue-on-error: true
      - name: Echte eind-tot-eindtest (Verkenner + slepen met de muis)
        if: success() || failure()
        run: python tests/windows_e2e.py
      - name: Roomba.exe bouwen
        if: success() || failure()
        shell: pwsh
        run: |
          python -m kde_roomba.make_icon windows\roomba.ico
          $common = @("--noconfirm", "--windowed", "--icon", "windows\roomba.ico", "--paths", ".",
                      "--collect-submodules", "comtypes", "--hidden-import", "kde_roomba.windows_shell",
                      "--hidden-import", "kde_roomba.windows_integration")
          # map-versie (start sneller) en één los bestand
          pyinstaller @common --name Roomba windows\run_roomba.py
          pyinstaller @common --onefile --name Roomba --distpath dist-onefile --workpath build-onefile windows\run_roomba.py
          Compress-Archive -Path dist\Roomba\* -DestinationPath Roomba-windows.zip -Force
          Get-Item dist-onefile\Roomba.exe, Roomba-windows.zip | Select-Object Name, Length
      - name: Release maken
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KDE Roomba ${{ github.ref_name }}
          body_path: windows/RELEASE_NOTES.md
          files: |
            dist-onefile/Roomba.exe
            Roomba-windows.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roomba-windows
          path: |
            e2e-out/
            dist-onefile/Roomba.exe
            Roomba-windows.zip
